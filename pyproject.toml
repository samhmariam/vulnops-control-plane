[project]
name = "vulnops-control-plane"
version = "0.1.0"
description = "Framework-independent vulnerability remediation control plane."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
