services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vulnops
      POSTGRES_USER: vulnops_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnops_dev_admin}
      VULNOPS_APP_PASSWORD: ${VULNOPS_APP_PASSWORD:-vulnops_dev_app}
    ports:
      - "127.0.0.1:${VULNOPS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lab/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnops_admin -d vulnops"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
